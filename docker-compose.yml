services:
  db:
    image: postgres:15-alpine
    container_name: supportai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-supportai_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supportai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supportai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportai_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-supportai_db}}
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-}
      RETRIEVAL_SERVICE_URL: ${RETRIEVAL_SERVICE_URL:-}
      RAG_SERVICE_URL: ${RAG_SERVICE_URL:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - supportai_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportai_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - supportai_network

volumes:
  pgdata:
  backend_uploads:

networks:
  supportai_network:
    driver: bridge
